name: Mobile Android

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "GitVersion.yml"
      - ".editorconfig"
      - ".gitattributes"
      - "Directory.Build.props"
      - "src/Cotton.Mobile.Core/**"
      - "src/Cotton.Mobile/**"
      - "tests/**"
      - "scripts/ci/**"
      - "scripts/mobile/**"
      - "store/google-play/**"
      - ".github/workflows/mobile-*.yml"
  pull_request:
    paths:
      - "GitVersion.yml"
      - ".editorconfig"
      - ".gitattributes"
      - "Directory.Build.props"
      - "src/Cotton.Mobile.Core/**"
      - "src/Cotton.Mobile/**"
      - "tests/**"
      - "scripts/ci/**"
      - "scripts/mobile/**"
      - "store/google-play/**"
      - ".github/workflows/mobile-*.yml"
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: Build signed APK and AAB artifacts.
        required: true
        type: boolean
        default: false
      upload_to_google_play:
        description: Upload signed AAB to Google Play after the release build.
        required: true
        type: boolean
        default: false
      publish_github_release:
        description: Publish the signed APK to the computed SemVer GitHub Release.
        required: true
        type: boolean
        default: false
      github_release_tag:
        description: Optional SemVer GitHub Release tag override.
        required: false
        type: string
        default: ""
      upload_store_listing:
        description: Upload default store listing text and graphics to Google Play.
        required: true
        type: boolean
        default: false
      confirm_store_listing_review_submission:
        description: Confirm Google Play may send store listing changes for review.
        required: true
        type: boolean
        default: false
      google_play_track:
        description: Google Play release track.
        required: true
        type: string
        default: alpha
      google_play_release_status:
        description: Google Play release status.
        required: true
        type: choice
        options:
          - completed
          - draft
        default: completed
      google_play_changes_not_sent_for_review:
        description: Commit the edit without sending changes for review.
        required: true
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  workflow-dispatch-guards:
    name: Validate Manual Release Inputs
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Validate release input combinations
        env:
          BUILD_SIGNED_RELEASE: ${{ inputs.build_signed_release }}
          GITHUB_RELEASE_TAG_INPUT: ${{ inputs.github_release_tag }}
          PUBLISH_GITHUB_RELEASE: ${{ inputs.publish_github_release }}
          UPLOAD_TO_GOOGLE_PLAY: ${{ inputs.upload_to_google_play }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]] \
            && [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Manual production operations require main or a SemVer tag." >&2
            exit 1
          fi

          if [[ "$PUBLISH_GITHUB_RELEASE" == "true" && "$BUILD_SIGNED_RELEASE" != "true" ]]; then
            echo "publish_github_release requires build_signed_release=true." >&2
            exit 1
          fi

          if [[ "$UPLOAD_TO_GOOGLE_PLAY" == "true" && "$BUILD_SIGNED_RELEASE" != "true" ]]; then
            echo "upload_to_google_play requires build_signed_release=true." >&2
            exit 1
          fi

          if [[ "$PUBLISH_GITHUB_RELEASE" == "true" \
            && -n "$GITHUB_RELEASE_TAG_INPUT" \
            && ! "$GITHUB_RELEASE_TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "github_release_tag must be blank or a SemVer tag such as v1.0.0." >&2
            exit 1
          fi

          if [[ "$UPLOAD_TO_GOOGLE_PLAY" == "true" ]]; then
            if [[ "${GITHUB_REF_TYPE:-}" != "tag" \
              || ! "${GITHUB_REF_NAME:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "upload_to_google_play requires a SemVer tag such as v1.0.0." >&2
              exit 1
            fi
          fi

  quality:
    name: Validate Mobile Quality
    uses: ./.github/workflows/mobile-quality.yml
    permissions:
      contents: read

  android-release-plan:
    name: Plan Android Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    outputs:
      google_play_track: ${{ steps.policy.outputs.google_play_track }}
      publish_github_release: ${{ steps.policy.outputs.publish_github_release }}
      release_required: ${{ steps.detect.outputs.release_required }}
      upload_to_google_play: ${{ steps.policy.outputs.upload_to_google_play }}
    steps:
      - name: Check repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect release changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            published_release_tag="$(
              gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq 'map(select(.draft == false and .prerelease == false))[0].tag_name // ""'
            )"
          else
            published_release_tag="$(
              gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq 'map(select(.draft == false and .prerelease == true))[0].tag_name // ""'
            )"
          fi

          scripts/mobile/detect-android-release-changes.sh \
            "${{ github.event.before }}" \
            "$GITHUB_SHA" \
            "$published_release_tag"

      - name: Resolve branch distribution
        id: policy
        run: scripts/mobile/resolve-android-release-policy.sh "$GITHUB_REF_NAME"

  android-debug:
    name: Build Debug APK
    needs:
      - android-release-plan
      - quality
    if: >-
      ${{
        always() &&
        needs.quality.result == 'success' &&
        (
          github.event_name != 'push' ||
          (
            needs.android-release-plan.result == 'success' &&
            needs.android-release-plan.outputs.release_required == 'true'
          )
        )
      }}
    uses: ./.github/workflows/mobile-debug.yml
    permissions:
      contents: read

  android-branch-release:
    name: Distribute Signed Branch Release
    needs:
      - android-release-plan
      - android-debug
      - quality
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        needs.quality.result == 'success' &&
        needs.android-debug.result == 'success' &&
        needs.android-release-plan.result == 'success' &&
        needs.android-release-plan.outputs.release_required == 'true'
      }}
    concurrency:
      group: mobile-android-release
      cancel-in-progress: false
    uses: ./.github/workflows/mobile-release.yml
    with:
      github_release_tag: ''
      google_play_changes_not_sent_for_review: false
      google_play_release_status: completed
      google_play_track: ${{ needs.android-release-plan.outputs.google_play_track }}
      publish_github_release: ${{ fromJSON(needs.android-release-plan.outputs.publish_github_release) }}
      upload_to_google_play: ${{ fromJSON(needs.android-release-plan.outputs.upload_to_google_play) }}
    secrets: inherit
    permissions:
      contents: write

  android-manual-release:
    name: Build Manually Requested Signed Release
    needs:
      - workflow-dispatch-guards
      - android-debug
      - quality
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.build_signed_release &&
        needs.workflow-dispatch-guards.result == 'success' &&
        needs.quality.result == 'success' &&
        needs.android-debug.result == 'success'
      }}
    concurrency:
      group: mobile-android-release
      cancel-in-progress: false
    uses: ./.github/workflows/mobile-release.yml
    with:
      github_release_tag: ${{ inputs.github_release_tag }}
      google_play_changes_not_sent_for_review: ${{ inputs.google_play_changes_not_sent_for_review }}
      google_play_release_status: ${{ inputs.google_play_release_status }}
      google_play_track: ${{ inputs.google_play_track }}
      publish_github_release: ${{ inputs.publish_github_release }}
      upload_to_google_play: ${{ inputs.upload_to_google_play }}
    secrets: inherit
    permissions:
      contents: write

  google-play-store-listing:
    name: Upload Google Play Store Listing
    needs:
      - workflow-dispatch-guards
    if: github.event_name == 'workflow_dispatch' && inputs.upload_store_listing
    uses: ./.github/workflows/mobile-store-listing.yml
    with:
      confirm_review_submission: ${{ inputs.confirm_store_listing_review_submission }}
      changes_not_sent_for_review: ${{ inputs.google_play_changes_not_sent_for_review }}
    secrets: inherit
    permissions:
      contents: read
