name: Mobile Android Runtime

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  PROJECT_PATH: src/Cotton.Mobile/Cotton.Mobile.csproj
  DOTNET_VERSION: 10.0.x
  JAVA_VERSION: "21"
  ANDROID_PLATFORM: "platforms;android-36"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"

jobs:
  android-runtime:
    name: Android ${{ matrix.api }} Runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api:
          - 26
          - 29
          - 33
          - 34
          - 36
    steps:
      - name: Check repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android dependencies
        run: scripts/mobile/install-android-ci-dependencies.sh "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS"

      - name: Restore mobile project
        run: dotnet restore "$PROJECT_PATH"

      - name: Build debug APK
        run: |
          dotnet build "$PROJECT_PATH" \
            -f net10.0-android \
            -c Debug \
            --no-restore \
            -p:EmbedAssembliesIntoApk=true \
            -p:CottonUiTests=true

      - name: Allow Android emulator acceleration
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Test Android runtime behavior
        timeout-minutes: 20
        env:
          COTTON_ANDROID_RUNTIME_API: ${{ matrix.api }}
          COTTON_ANDROID_UPLOAD_UI_OUTPUT: artifacts/upload-ui
        run: |
          scripts/mobile/test-android-runtime.sh \
            src/Cotton.Mobile/bin/Debug/net10.0-android/dev.cottoncloud.app.debug-Signed.apk \
            store/google-play/default-listing/graphics/icon.png

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cotton-mobile-upload-ui-api-${{ matrix.api }}
          path: artifacts/upload-ui
          retention-days: 14
