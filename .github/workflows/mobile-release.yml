name: Mobile Signed Release

on:
  workflow_call:
    inputs:
      github_release_tag:
        required: true
        type: string
      google_play_changes_not_sent_for_review:
        required: true
        type: boolean
      google_play_release_status:
        required: true
        type: string
      google_play_track:
        required: true
        type: string
      publish_github_release:
        required: true
        type: boolean
      upload_to_google_play:
        required: true
        type: boolean
    secrets:
      ANDROID_KEYSTORE_ALIAS:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: false

defaults:
  run:
    shell: bash

env:
  PROJECT_PATH: src/Cotton.Mobile/Cotton.Mobile.csproj
  DOTNET_VERSION: 10.0.x
  JAVA_VERSION: "21"
  ANDROID_PLATFORM: "platforms;android-36"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"
  BUNDLETOOL_VERSION: "1.18.3"
  BUNDLETOOL_SHA256: "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
  ANDROID_VERSION_CODE_BASE: "1001000"
  ANDROID_VERSION_CODE_PUBLISHED_FLOOR: "1000449"
  GOOGLE_PLAY_DEFAULT_TRACK: alpha
  GOOGLE_PLAY_PACKAGE_NAME: dev.cottoncloud.app
  ANDROID_RUNTIME_APIS: "26 29 33 34 36"

jobs:
  android-signed-release:
    name: Build Signed Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute Android release version
        env:
          GITHUB_RELEASE_TAG_INPUT: ${{ inputs.github_release_tag }}
        run: |
          release_version_input="${GITHUB_RELEASE_TAG_INPUT#v}"
          scripts/mobile/compute-android-release-version.sh "$release_version_input"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android dependencies
        run: scripts/mobile/install-android-ci-dependencies.sh "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS"

      - name: Validate signing secrets
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required." >&2
            exit 1
          fi
          if [[ -z "${ANDROID_KEYSTORE_ALIAS:-}" ]]; then
            echo "ANDROID_KEYSTORE_ALIAS secret is required." >&2
            exit 1
          fi
          if [[ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]]; then
            echo "ANDROID_KEYSTORE_PASSWORD secret is required." >&2
            exit 1
          fi
          if [[ -z "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Restore mobile project
        run: dotnet restore "$PROJECT_PATH"

      - name: Verify mobile formatting
        run: dotnet format "$PROJECT_PATH" --no-restore --verify-no-changes --severity info

      - name: Decode upload keystore
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cotton-upload.keystore"
          chmod 600 "$RUNNER_TEMP/cotton-upload.keystore"

      - name: Publish signed APK and AAB
        run: |
          dotnet publish "$PROJECT_PATH" \
            -f net10.0-android \
            -c Release \
            --no-restore \
            -p:AndroidPackageFormats=apk%3Baab \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/cotton-upload.keystore" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEYSTORE_ALIAS" \
            -p:AndroidSigningKeyPass="env:ANDROID_KEY_PASSWORD" \
            -p:AndroidSigningStorePass="env:ANDROID_KEYSTORE_PASSWORD" \
            -p:RequireComputedAndroidReleaseVersion=true \
            -p:ApplicationDisplayVersion="$APPLICATION_DISPLAY_VERSION" \
            -p:ApplicationVersion="$ANDROID_VERSION_CODE"

      - name: Stage and verify signed Android artifacts
        run: |
          signed_dir="$GITHUB_WORKSPACE/.artifacts/signed-android"
          mkdir -p "$signed_dir"

          mapfile -t signed_apks < <(find \
            src/Cotton.Mobile/bin/Release/net10.0-android \
            -maxdepth 1 \
            -name '*-Signed.apk' \
            -type f)
          mapfile -t signed_aabs < <(find \
            src/Cotton.Mobile/bin/Release/net10.0-android/publish \
            -maxdepth 1 \
            -name '*-Signed.aab' \
            -type f)
          if [[ "${#signed_apks[@]}" -ne 1 || "${#signed_aabs[@]}" -ne 1 ]]; then
            echo "Expected exactly one signed APK and one signed AAB." >&2
            printf 'APKs: %s\nAABs: %s\n' "${signed_apks[*]}" "${signed_aabs[*]}" >&2
            exit 1
          fi

          cp "${signed_apks[0]}" "$signed_dir/CottonCloud-Android.apk"
          cp "${signed_aabs[0]}" "$signed_dir/CottonCloud-Android.aab"
          apksigner verify --verbose --print-certs "$signed_dir/CottonCloud-Android.apk"
          jarsigner -verify -certs "$signed_dir/CottonCloud-Android.aab"
          echo "COTTON_SIGNED_ANDROID_DIR=$signed_dir" >> "$GITHUB_ENV"
          echo "COTTON_SIGNED_APK=$signed_dir/CottonCloud-Android.apk" >> "$GITHUB_ENV"
          echo "COTTON_SIGNED_AAB=$signed_dir/CottonCloud-Android.aab" >> "$GITHUB_ENV"

      - name: Build signed runtime APK from the published AAB
        run: |
          bundletool_jar="$RUNNER_TEMP/bundletool-all-$BUNDLETOOL_VERSION.jar"
          bundletool_apks="$RUNNER_TEMP/cotton-mobile-release.apks"
          runtime_apk="$RUNNER_TEMP/CottonCloud-Android-AAB-universal.apk"
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar" \
            --output "$bundletool_jar"
          printf '%s  %s\n' "$BUNDLETOOL_SHA256" "$bundletool_jar" | sha256sum --check
          java -jar "$bundletool_jar" build-apks \
            --bundle="$COTTON_SIGNED_AAB" \
            --output="$bundletool_apks" \
            --mode=universal \
            --ks="$RUNNER_TEMP/cotton-upload.keystore" \
            --ks-key-alias="$ANDROID_KEYSTORE_ALIAS" \
            --ks-pass="pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass="pass:$ANDROID_KEY_PASSWORD"
          unzip -p "$bundletool_apks" universal.apk > "$runtime_apk"
          apksigner verify --verbose --print-certs "$runtime_apk"
          echo "COTTON_RELEASE_RUNTIME_APK=$runtime_apk" >> "$GITHUB_ENV"

      - name: Allow Android emulator acceleration
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Test signed Release APK across supported Android boundaries
        timeout-minutes: 90
        run: |
          for api in $ANDROID_RUNTIME_APIS; do
            scripts/mobile/test-android-release-runtime.sh \
              "$COTTON_RELEASE_RUNTIME_APK" \
              "$api"
          done

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cotton-mobile-signed-android
          path: .artifacts/signed-android
          if-no-files-found: error
          retention-days: 30

      - name: Prepare GitHub Release assets
        if: inputs.publish_github_release
        env:
          GITHUB_RELEASE_TAG_INPUT: ${{ inputs.github_release_tag }}
        run: |
          release_dir="$RUNNER_TEMP/cotton-mobile-github-release"
          mkdir -p "$release_dir"

          cp "$COTTON_SIGNED_APK" "$release_dir/CottonCloud-Android.apk"
          cp "$COTTON_SIGNED_AAB" "$release_dir/CottonCloud-Android.aab"

          tag="${GITHUB_RELEASE_TAG_INPUT:-$ANDROID_DISPLAY_VERSION_TAG}"
          scripts/mobile/create-android-release-notes.sh \
            "$tag" \
            "$APPLICATION_DISPLAY_VERSION" \
            "$ANDROID_VERSION_CODE" \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            > "$release_dir/release-notes.md"

          echo "COTTON_GITHUB_RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"
          echo "COTTON_GITHUB_RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Setup Python
        if: inputs.upload_to_google_play
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Google Play upload dependencies
        if: inputs.upload_to_google_play
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install google-auth requests

      - name: Upload signed AAB to Google Play
        if: inputs.upload_to_google_play
        env:
          CHANGES_NOT_SENT_FOR_REVIEW: ${{ inputs.google_play_changes_not_sent_for_review }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_RELEASE_STATUS_INPUT: ${{ inputs.google_play_release_status }}
          GOOGLE_PLAY_TRACK_INPUT: ${{ inputs.google_play_track }}
        run: |
          if [[ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is required for Google Play upload." >&2
            exit 1
          fi

          changes_not_sent_flag=()
          if [[ "$CHANGES_NOT_SENT_FOR_REVIEW" == "true" ]]; then
            changes_not_sent_flag+=(--changes-not-sent-for-review)
          fi

          python3 scripts/mobile/upload-google-play.py \
            --package-name "$GOOGLE_PLAY_PACKAGE_NAME" \
            --bundle "$COTTON_SIGNED_AAB" \
            --track "${GOOGLE_PLAY_TRACK_INPUT:-$GOOGLE_PLAY_DEFAULT_TRACK}" \
            --release-status "${GOOGLE_PLAY_RELEASE_STATUS_INPUT:-completed}" \
            --release-name "$GOOGLE_PLAY_RELEASE_NAME" \
            --release-notes-file store/google-play/default-listing/release-notes.txt \
            "${changes_not_sent_flag[@]}"

      - name: Publish versioned GitHub Release
        if: inputs.publish_github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/mobile/publish-android-github-release.sh \
            "$COTTON_GITHUB_RELEASE_TAG" \
            "$COTTON_GITHUB_RELEASE_DIR" \
            "$APPLICATION_DISPLAY_VERSION" \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            "$GITHUB_EVENT_NAME"
